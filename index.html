<title>Puzzle Playroom</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Puzzles">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<style>
/* Layout: a toy-shelf home screen of big picture cards; the game is one full screen with the board on one side and loose pieces on the other. */
/* Single bright look on purpose (a toddler toy), so no dark variant. */
:root {
  --bg: #fff3e4;
  --bg-dot: #ffe6cc;
  --ink: #3b2a4a;
  --berry: #ff5d8f;
  --mint: #4cc79c;
  --sky: #6fc2ff;
  --sun: #ffc93c;
  --card: #ffffff;
  --shadow: rgba(92, 52, 96, 0.20);
  --display: "Baloo 2", ui-rounded, "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--display);
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
button { font-family: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 4px solid var(--sky); outline-offset: 4px; }

/* ---------- Home ---------- */
.home {
  min-height: 100%;
  box-sizing: border-box;
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background-image: radial-gradient(var(--bg-dot) 2.5px, transparent 3px);
  background-size: 28px 28px;
}
.wrap { width: 100%; max-width: 1100px; margin: 0 auto; display: grid; gap: 28px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px 24px; flex-wrap: wrap; }
h1 { margin: 0; font-size: clamp(30px, 5vw, 46px); font-weight: 800; line-height: 1; letter-spacing: -0.01em; text-wrap: balance; }
h1 span:nth-child(1) { color: var(--berry); }
h1 span:nth-child(2) { color: var(--ink); }
.controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.sizes { display: flex; gap: 10px; background: var(--card); padding: 8px; border-radius: 24px; box-shadow: 0 5px 0 var(--shadow); }
.size-btn {
  border: 0; background: transparent; border-radius: 18px; padding: 8px 12px 6px;
  display: grid; justify-items: center; gap: 4px; min-width: 70px;
  font-size: 20px; font-weight: 800; line-height: 1;
}
.size-btn[aria-pressed="true"] { background: var(--sun); }
.mini { display: grid; gap: 3px; }
.mini i { width: 9px; height: 9px; border-radius: 3px; background: var(--ink); opacity: .75; }
.mini i.bar { width: 28px; height: 5px; border-radius: 2px; }
.mode-btn { font-size: 15px; font-weight: 800; gap: 3px; }
.mode-btn svg { width: 36px; height: 30px; }
.icon-btn {
  width: 64px; height: 64px; border-radius: 50%; border: 0; background: var(--card);
  box-shadow: 0 5px 0 var(--shadow); display: grid; place-items: center;
}
.icon-btn svg { width: 34px; height: 34px; }
.shelf { display: grid; gap: 12px; }
.shelf h2 {
  margin: 0; justify-self: start; font-size: 22px; font-weight: 800; letter-spacing: .02em;
  padding: 2px 16px; border-radius: 999px; color: #fff; background: var(--tone);
}
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 20px; }
.card {
  position: relative; border: 0; padding: 0; border-radius: 26px; overflow: hidden;
  aspect-ratio: 4 / 3; max-width: 100%; background: var(--card);
  box-shadow: 0 7px 0 var(--shadow); transition: transform .12s, box-shadow .12s;
  border: 5px solid var(--card);
}
.card:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--shadow); }
.card img { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: 20px; pointer-events: none; }
.badge {
  position: absolute; top: 8px; right: 8px; width: 44px; height: 44px;
  filter: drop-shadow(0 2px 2px rgba(0,0,0,.25));
}
/* My photos: press-and-hold controls so a toddler can't add or remove by accident */
.card-wrap { position: relative; display: grid; }
.card.holding { transform: scale(.96); }
.add-card { display: grid; place-items: center; align-content: center; gap: 4px; border: 5px dashed #ffb3cc; background: var(--card); }
.ring { width: 84px; height: 84px; }
.ring .prog { stroke-dasharray: 239; stroke-dashoffset: 239; transition: stroke-dashoffset .15s; }
.add-card.holding .ring .prog { stroke-dashoffset: 0; transition: stroke-dashoffset 1s linear; }
.add-card .hint { font-size: 17px; font-weight: 600; opacity: .75; }
.pick, .del {
  position: absolute; z-index: 2; display: none; place-items: center; border: 4px solid var(--card);
  box-shadow: 0 5px 0 var(--shadow); font-family: var(--display); cursor: pointer;
}
.pick {
  inset: 50% auto auto 50%; transform: translate(-50%, -50%); padding: 12px 26px; border-radius: 999px;
  background: var(--berry); color: #fff; font-size: 22px; font-weight: 800; white-space: nowrap;
}
.card-wrap.open .pick { display: grid; animation: popin .3s cubic-bezier(.3,1.6,.5,1); }
.card-wrap.open .add-card .ring, .card-wrap.open .add-card .hint { visibility: hidden; }
.del { top: 10px; left: 10px; width: 66px; height: 66px; border-radius: 50%; background: #ff5d5d; padding: 0; }
.del svg { width: 34px; height: 34px; }
.card-wrap.editing .del { display: grid; animation: popin .3s cubic-bezier(.3,1.6,.5,1); }
.card-wrap.editing .card img { opacity: .55; }
.visually-hidden { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }
.note { margin: 0; font-family: system-ui, sans-serif; font-size: 14px; opacity: .7; max-width: 60ch; }

/* ---------- Game ---------- */
.game {
  position: fixed; inset: 0; overflow: hidden; touch-action: none;
  background: var(--bg);
  background-image: radial-gradient(var(--bg-dot) 2.5px, transparent 3px);
  background-size: 28px 28px;
}
.round-btn {
  position: absolute; z-index: 40; width: 72px; height: 72px; border-radius: 50%; border: 0;
  background: var(--card); box-shadow: 0 5px 0 var(--shadow); display: grid; place-items: center;
}
.round-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--shadow); }
.round-btn svg { width: 40px; height: 40px; }
#homeBtn, #playHome { top: calc(14px + env(safe-area-inset-top, 0px)); left: calc(14px + env(safe-area-inset-left, 0px)); }

/* ---------- Mini games ---------- */
#playArea { position: absolute; inset: 0; }
#playFx { position: absolute; inset: 0; z-index: 35; pointer-events: none; }
.corner-tools {
  position: absolute; z-index: 40; top: calc(14px + env(safe-area-inset-top, 0px)); right: calc(14px + env(safe-area-inset-right, 0px));
  display: flex; gap: 8px; background: var(--card); padding: 8px; border-radius: 26px; box-shadow: 0 5px 0 var(--shadow);
}
.tool-btn { width: 60px; height: 56px; border: 0; border-radius: 18px; background: transparent; display: grid; place-items: center; font: 800 22px/1 var(--display); }
.tool-btn[aria-pressed="true"] { background: var(--sun); }
.tool-btn svg { width: 36px; height: 36px; }
/* Numbers */
.num-stage { position: absolute; left: 96px; right: 24px; top: calc(20px + env(safe-area-inset-top, 0px)); height: 48%; display: flex; align-items: center; justify-content: center; gap: 3%; }
.num-big { font: 800 clamp(90px, 22vh, 210px)/1 var(--display); color: var(--c, var(--ink)); text-shadow: 0 7px 0 rgba(59,42,74,.15); min-width: 1.1em; text-align: center; }
.num-big.bump { animation: cheer .6s cubic-bezier(.3,1.6,.5,1); }
.num-items { display: flex; flex-wrap: wrap; justify-content: center; align-content: center; gap: 8px; flex: 0 1 68%; align-self: stretch; }
.num-items svg { width: var(--s); height: var(--s); animation: popin .4s cubic-bezier(.3,1.6,.5,1) both; overflow: visible; }
.num-pad {
  position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(18px + env(safe-area-inset-bottom, 0px)); height: 40%; display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px;
}
.num-btn {
  border: 0; border-radius: 28px; background: var(--c); color: #fff; font: 800 clamp(44px, 10vh, 104px)/1 var(--display);
  box-shadow: 0 8px 0 rgba(59,42,74,.22); text-shadow: 0 3px 0 rgba(0,0,0,.14); transition: transform .1s, box-shadow .1s;
}
@media (orientation: portrait) {
  .num-stage { flex-direction: column; left: 24px; top: calc(92px + env(safe-area-inset-top, 0px)); gap: 6px; }
  .num-big { font-size: clamp(70px, 11vh, 150px); }
  .num-items { flex: 1 1 auto; width: 100%; }
}
.num-btn.hit { transform: translateY(6px) scale(.96); box-shadow: 0 2px 0 rgba(59,42,74,.22); }
/* Balloons */
.sky-bg { position: absolute; inset: 0; background: linear-gradient(#8fd3ff, #e9f8ff); }
.sky-bg svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.balloon { position: absolute; left: 0; top: 0; will-change: transform; }
.balloon svg { display: block; width: 100%; height: auto; overflow: visible; }
/* Xylophone */
.xylo-bg { position: absolute; inset: 0; background: radial-gradient(circle at 50% 30%, #fff8ee, #ffe6cc); }
.xylo { position: absolute; left: max(4%, 16px); right: max(4%, 16px); top: calc(96px + env(safe-area-inset-top, 0px)); bottom: calc(36px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; justify-content: center; gap: 1.8%; }
.xylo::before, .xylo::after { content: ""; position: absolute; left: -1%; right: -1%; height: 22px; border-radius: 11px; background: #b9814f; box-shadow: 0 5px 0 #8a5a3c; z-index: 0; }
.xylo::before { top: 22%; transform: rotate(-4deg); }
.xylo::after { bottom: 22%; transform: rotate(4deg); }
.bar {
  position: relative; z-index: 1; flex: 1; border-radius: 22px; background: var(--c); box-shadow: 0 8px 0 rgba(59,42,74,.22), inset 0 -10px 0 rgba(0,0,0,.08), inset 0 10px 0 rgba(255,255,255,.25);
  transition: transform .08s, filter .08s;
}
.bar::before, .bar::after { content: ""; position: absolute; left: 50%; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: #fff; box-shadow: inset 0 -3px 0 rgba(0,0,0,.15); }
.bar::before { top: 14%; } .bar::after { bottom: 14%; }
.bar.hit { transform: scale(.95); filter: brightness(1.18) saturate(1.1); }
.note-fly { position: absolute; z-index: 30; width: 46px; height: 46px; pointer-events: none; animation: noteUp 1.3s ease-out forwards; }
@keyframes noteUp { from { transform: translate(-50%, 0) scale(.6); opacity: 1; } to { transform: translate(-50%, -180px) scale(1.2) rotate(18deg); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .note-fly { animation-duration: .01s; } }
.layer { position: absolute; left: 0; top: 0; }
#ghost { z-index: 1; border-radius: 6px; box-shadow: 0 0 0 10px var(--card), 0 16px 26px 6px var(--shadow); }
#full { z-index: 30; border-radius: 6px; opacity: 0; transition: opacity .7s ease; pointer-events: none; }
#full.show { opacity: 1; }
.cheer { animation: cheer .8s cubic-bezier(.3,1.6,.5,1); }
@keyframes cheer { 0% { transform: scale(1); } 40% { transform: scale(1.06); } 100% { transform: scale(1); } }
.slot {
  position: absolute; z-index: 3; border-radius: 16px; pointer-events: none; opacity: 0;
  box-shadow: 0 0 0 5px rgba(255,255,255,.95), 0 0 28px 10px rgba(255,201,60,.95);
  transition: opacity .2s;
}
.slot.show { opacity: 1; animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 7px rgba(255,255,255,.95), 0 0 40px 16px rgba(255,201,60,.95); } }
.piece { position: absolute; left: 0; top: 0; will-change: transform; }
.piece canvas { display: block; transition: transform .15s ease, filter .15s ease; filter: drop-shadow(0 5px 3px rgba(70,35,80,.30)); }
.piece.lifted canvas { transform: scale(1.08); filter: drop-shadow(0 16px 12px rgba(70,35,80,.32)); }
.piece.locked canvas { filter: none; }
.piece.anim { transition: transform .32s cubic-bezier(.3,1.35,.5,1); }
.piece.wiggle canvas { animation: wiggle .5s ease-in-out 3; }
@keyframes wiggle { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-9deg) scale(1.05); } 75% { transform: rotate(9deg) scale(1.05); } }
#fx { position: absolute; inset: 0; z-index: 35; pointer-events: none; }
.done-bar {
  position: absolute; z-index: 45; left: 0; right: 0;
  bottom: calc(26px + env(safe-area-inset-bottom, 0px));
  display: flex; justify-content: center; gap: 26px;
}
.done-bar .round-btn { position: static; width: 104px; height: 104px; animation: popin .5s cubic-bezier(.3,1.6,.5,1) both; }
.done-bar .round-btn:nth-child(2) { animation-delay: .1s; background: var(--sun); }
.done-bar .round-btn:nth-child(3) { animation-delay: .2s; }
.done-bar .round-btn svg { width: 56px; height: 56px; }
@keyframes popin { from { transform: scale(0); } to { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) {
  .cheer, .slot.show, .piece.wiggle canvas, .done-bar .round-btn { animation: none; }
  .piece.anim { transition-duration: .01s; }
}
</style>

<main class="home" id="home">
  <div class="wrap">
    <div class="top">
      <h1><span>Puzzle</span> <span>Playroom</span></h1>
      <div class="controls">
        <div class="sizes" role="group" aria-label="Puzzle style" id="modes"></div>
        <div class="sizes" role="group" aria-label="Number of pieces" id="sizes"></div>
        <button class="icon-btn" id="soundBtn" aria-label="Sound on"></button>
      </div>
    </div>
    <div id="shelves" class="wrap"></div>
    <p class="note">Tap a picture to start. Pieces snap into place when they get close. Finished puzzles earn a star. Grown-ups: press and hold the + card to add photos from this iPad, or hold a photo to remove it. Photos stay on this device.</p>
    <input type="file" id="photoInput" class="visually-hidden" accept="image/*" multiple tabindex="-1">
  </div>
</main>

<section class="game" id="play" hidden>
  <div id="playArea"></div>
  <canvas id="playFx"></canvas>
  <button class="round-btn" id="playHome" aria-label="Back to home">
    <svg viewBox="0 0 48 48"><path d="M8 23 24 9l16 14" fill="none" stroke="#3b2a4a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M13 21v17a2 2 0 0 0 2 2h7V30h4v10h7a2 2 0 0 0 2-2V21" fill="#ff5d8f"/></svg>
  </button>
</section>

<section class="game" id="game" hidden>
  <canvas class="layer" id="ghost"></canvas>
  <div class="slot" id="slot"></div>
  <div id="pieces"></div>
  <canvas class="layer" id="full"></canvas>
  <canvas id="fx"></canvas>
  <button class="round-btn" id="homeBtn" aria-label="Back to pictures">
    <svg viewBox="0 0 48 48"><path d="M8 23 24 9l16 14" fill="none" stroke="#3b2a4a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M13 21v17a2 2 0 0 0 2 2h7V30h4v10h7a2 2 0 0 0 2-2V21" fill="#ff5d8f"/></svg>
  </button>
  <div class="done-bar" id="doneBar" hidden>
    <button class="round-btn" id="againBtn" aria-label="Play again">
      <svg viewBox="0 0 48 48"><path d="M37 26a13 13 0 1 1-4-11" fill="none" stroke="#3b2a4a" stroke-width="5.5" stroke-linecap="round"/><path d="M27 9h10v10z" fill="#3b2a4a" stroke="#3b2a4a" stroke-width="3" stroke-linejoin="round"/></svg>
    </button>
    <button class="round-btn" id="nextBtn" aria-label="Next picture">
      <svg viewBox="0 0 48 48"><path d="M10 24h24M24 12l12 12-12 12" fill="none" stroke="#3b2a4a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="round-btn" id="doneHomeBtn" aria-label="Back to pictures">
      <svg viewBox="0 0 48 48"><path d="M8 23 24 9l16 14" fill="none" stroke="#3b2a4a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M13 21v17a2 2 0 0 0 2 2h7V30h4v10h7a2 2 0 0 0 2-2V21" fill="#ff5d8f"/></svg>
    </button>
  </div>
</section>

<script>
(() => {
"use strict";

/* ================= Pictures (drawn as SVG, 480x360) ================= */
const rng = (seed) => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const f1 = (n) => n.toFixed(1);
const INK = "#2f2036";
const sky = (a, b) => `<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="480" height="360" fill="url(#g)"/>`;
const cloud = (x, y, s, fill = "#fff") => `<g transform="translate(${x} ${y}) scale(${s})" fill="${fill}"><ellipse cx="0" cy="0" rx="36" ry="18"/><circle cx="-16" cy="-10" r="17"/><circle cx="10" cy="-17" r="21"/><circle cx="29" cy="-4" r="14"/></g>`;
const sun = (x, y, r) => `<g transform="translate(${x} ${y})">${Array.from({ length: 10 }, (_, i) => { const a = i / 10 * Math.PI * 2; return `<line x1="${f1(Math.cos(a) * (r + 9))}" y1="${f1(Math.sin(a) * (r + 9))}" x2="${f1(Math.cos(a) * (r + 22))}" y2="${f1(Math.sin(a) * (r + 22))}" stroke="#ffc93c" stroke-width="7" stroke-linecap="round"/>`; }).join("")}<circle r="${r}" fill="#ffd84d"/><circle cx="${-r * .3}" cy="${-r * .1}" r="3.5" fill="${INK}"/><circle cx="${r * .3}" cy="${-r * .1}" r="3.5" fill="${INK}"/><path d="M${-r * .3} ${r * .2} Q0 ${r * .45} ${r * .3} ${r * .2}" stroke="${INK}" stroke-width="3" fill="none" stroke-linecap="round"/></g>`;
const flower = (x, y, c, s = 1) => `<g transform="translate(${x} ${y}) scale(${s})">${[0, 1, 2, 3, 4].map(i => { const a = i / 5 * Math.PI * 2; return `<circle cx="${f1(Math.cos(a) * 8)}" cy="${f1(Math.sin(a) * 8)}" r="7" fill="${c}"/>`; }).join("")}<circle r="5" fill="#ffd84d"/></g>`;
const eye = (x, y, r) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${INK}"/><circle cx="${f1(x - r * .35)}" cy="${f1(y - r * .38)}" r="${f1(r * .4)}" fill="#fff"/>`;
const happyEye = (x, y) => `<path d="M${x - 12} ${y + 2} Q${x} ${y - 12} ${x + 12} ${y + 2}" stroke="${INK}" stroke-width="5" fill="none" stroke-linecap="round"/>`;
const cheek = (x, y) => `<ellipse cx="${x}" cy="${y}" rx="13" ry="8" fill="#ff7fa8" opacity=".55"/>`;
const smile = (x, y, w) => `<path d="M${x - w} ${y} Q${x} ${y + w * .9} ${x + w} ${y}" stroke="${INK}" stroke-width="5" fill="none" stroke-linecap="round"/>`;
const hills = (a, b) => `<path d="M0 268 Q120 236 240 260 T480 252 V360 H0Z" fill="${a}"/><path d="M0 302 Q140 284 262 306 T480 298 V360 H0Z" fill="${b}"/>`;
const starD = (cx, cy, R, r) => { let d = ""; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? r : R; d += (i ? "L" : "M") + f1(cx + Math.cos(a) * rad) + " " + f1(cy + Math.sin(a) * rad); } return d + "Z"; };
const SPRINKLE = ["#ff5d8f", "#ffc93c", "#6fc2ff", "#4cc79c", "#b98cff", "#ffffff"];
const sprinkles = (seed, n, x, y, w, h, colors = SPRINKLE) => { const r = rng(seed); let s = ""; for (let i = 0; i < n; i++) { const cx = x + r() * w, cy = y + r() * h; s += `<rect x="${f1(cx - 2.5)}" y="${f1(cy - 7)}" width="5" height="14" rx="2.5" fill="${colors[i % colors.length]}" transform="rotate(${Math.round(r() * 180)} ${f1(cx)} ${f1(cy)})"/>`; } return s; };
const scoopDrip = (cx, y, w, c) => { const n = 6, step = w / n; let d = `M${cx - w / 2} ${y - 14}`; for (let i = 0; i < n; i++) { const x0 = cx - w / 2 + i * step; d += ` Q${f1(x0 + step / 2)} ${y + (i % 2 ? 22 : 30)} ${f1(x0 + step)} ${y}`; } return `<path d="${d} L${cx + w / 2} ${y - 14} Z" fill="${c}"/>`; };
const cone = (top, tipY) => `<defs><clipPath id="cn"><path d="M178 ${top} L302 ${top} L240 ${tipY} Z"/></clipPath></defs><path d="M178 ${top} L302 ${top} L240 ${tipY} Z" fill="#e9a95c"/><g clip-path="url(#cn)" stroke="#c9843a" stroke-width="4">${Array.from({ length: 9 }, (_, i) => `<line x1="${150 + i * 26}" y1="${top}" x2="${110 + i * 26}" y2="${tipY}"/><line x1="${150 + i * 26}" y1="${top}" x2="${190 + i * 26}" y2="${tipY}"/>`).join("")}</g>`;
const cherry = (x, y) => `<path d="M${x} ${y - 13} Q${x + 6} ${y - 30} ${x + 20} ${y - 34}" stroke="#5d3b28" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="${x}" cy="${y}" r="15" fill="#e63950"/><circle cx="${x - 5}" cy="${y - 5}" r="4" fill="#fff" opacity=".8"/>`;




const unicornHead = () => {
  const mane = [["#ff8fc8", 176, 140, 26], ["#b98cff", 162, 178, 24], ["#7fd1ff", 160, 216, 22], ["#ffd166", 172, 250, 20], ["#ff8fc8", 302, 142, 20], ["#b98cff", 310, 174, 16]]
    .map(([c, x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${c}"/>`).join("");

let dbp = null;
function db() {
  return dbp || (dbp = new Promise((res, rej) => {
    const req = indexedDB.open("puzzle-playroom", 1);
    req.onupgradeneeded = () => req.result.createObjectStore("photos", { keyPath: "id" });

async function photoStore(mode, fn) {

async function loadPhotos() {

    const recs = (await photoStore("readonly", s => s.getAll())) || [];

// Shrink big camera photos so puzzles stay quick and storage stays small.
async function shrink(file) {
  const src = URL.createObjectURL(file);
  try {
    const img = await loadImg(src), max = 1600;
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas");
    c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return await new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error("encode")), "image/jpeg", .88));
  } finally { URL.revokeObjectURL(src); }
}
async function addPhotos(files) {

  for (const file of files) {
    try {
      const rec = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), added: Date.now(), blob: await shrink(file) };
      try { await photoStore("readwrite", s => s.put(rec)); } catch (e) { /* storage unavailable: keep it for this session only */ }
      photoArt.unshift(toArt(rec));
    } catch (e) { /* skip files that aren't readable images */ }

}

// Press-and-hold: a quick tap does onTap; holding about a second does onHold.
const HOLD_MS = 1000;
function holdable(el, { onTap, onHold }) {
  let t = 0, active = false, armed = false, sx = 0, sy = 0;
  const reset = () => { clearTimeout(t); active = armed = false; el.classList.remove("holding"); };
  el.addEventListener("pointerdown", (e) => {
    if (e.button) return;
    active = true; armed = false; sx = e.clientX; sy = e.clientY; el.classList.add("holding");
    t = setTimeout(() => { armed = true; el.classList.remove("holding"); onHold(); }, HOLD_MS);
  });
  el.addEventListener("pointermove", (e) => { if (active && Math.hypot(e.clientX - sx, e.clientY - sy) > 14) reset(); });
  el.addEventListener("pointerup", () => { if (!active) return; const held = armed; reset(); if (!held && onTap) onTap(); });
  el.addEventListener("pointercancel", reset);
  el.addEventListener("pointerleave", (e) => { if (e.pointerType === "mouse" && !armed) reset(); });
  el.addEventListener("contextmenu", (e) => e.preventDefault());
  el.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); (onTap || onHold)(); } });
}

const KNOB = [[.34, 0], [.40, 0, .43, .05, .40, .11], [.32, .19, .38, .28, .50, .28], [.62, .28, .68, .19, .60, .11], [.57, .05, .60, 0, .66, 0], [1, 0]];
function edge(p, sx, sy, dx, dy, nx, ny, L, s, tab) {
  const pt = (u, v) => [sx + dx * u * L + nx * v * s * tab, sy + dy * u * L + ny * v * s * tab];
  if (!tab) { p.lineTo(sx + dx * L, sy + dy * L); return; }

  for (let i = 1; i <= 4; i++) { const k = KNOB[i]; p.bezierCurveTo(...pt(k[0], k[1]), ...pt(k[2], k[3]), ...pt(k[4], k[5])); }
  p.lineTo(...pt(1, 0));
}

  const p = new Path2D(), s = Math.min(w, h);
  p.moveTo(ox, oy);
  edge(p, ox, oy, 1, 0, 0, -1, w, s, t.top);
  edge(p, ox + w, oy, 0, 1, 1, 0, h, s, t.right);
  edge(p, ox + w, oy + h, -1, 0, 0, 1, w, s, t.bottom);
  edge(p, ox, oy + h, 0, -1, -1, 0, h, s, t.left);
  p.closePath();
  return p;
}

/* ================= Game ================= */
const ghost = $("#ghost"), full = $("#full"), slot = $("#slot"), piecesEl = $("#pieces"), fx = $("#fx"), doneBar = $("#doneBar");
let cur = null;          // current puzzle state
let L = null;            // current layout metrics
let zTop = 10;
let lastTouch = Date.now();
let wakeLock = null;

async function start(id) {
  const art = allArt().find(a => a.id === id), M = MODES[mode], [, cols, rows] = M.sizes[sizeIdx];
  if (!art) return;
  const rand = Math.random, tab = () => M.tabs ? (rand() < .5 ? 1 : -1) : 0;
  const H = Array.from({ length: rows }, () => Array.from({ length: cols - 1 }, tab));
  const V = Array.from({ length: rows - 1 }, () => Array.from({ length: cols }, tab));
  const pieces = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    pieces.push({
      r, c, locked: false,
      tabs: { top: r ? -V[r - 1][c] : 0, bottom: r < rows - 1 ? V[r][c] : 0, left: c ? -H[r][c - 1] : 0, right: c < cols - 1 ? H[r][c] : 0 },
    });
  }
  const slots = pieces.map((_, k) => k).sort(() => rand() - .5);
  if (slots.every((s, k) => s === k)) slots.reverse(); // never start already in order
  pieces.forEach((p, k) => { p.slot = slots[k]; p.jx = rand() * 2 - 1; p.jy = rand() * 2 - 1; });

  cur = { art, cols, rows, pieces, tabs: M.tabs, aspect: M.board ? M.board * rows / cols : 1, locked: 0, done: false, img: null };

  home.hidden = true; game.hidden = false; fxCanvas = fx;
  doneBar.hidden = true; full.classList.remove("show"); ghost.classList.remove("cheer");
  piecesEl.innerHTML = "";
  pieces.forEach(p => { p.el = document.createElement("div"); p.el.className = "piece"; p.cv = document.createElement("canvas"); p.el.appendChild(p.cv); piecesEl.appendChild(p.el); });
  zTop = 10; lastTouch = Date.now();
  try { wakeLock = await navigator.wakeLock?.request("screen"); } catch (e) { wakeLock = null; }
  const token = cur;
  try { cur.img = await loadArt(art); } catch (e) { if (cur === token) goHome(); return; }
  if (cur !== token) return;
  layout();
}

function layout() {
  if (!cur || !cur.img) return;
  const W = game.clientWidth, Hh = game.clientHeight, m = 20, topRes = 96;
  const { cols, rows, pieces, aspect: a } = cur, n = pieces.length;
  const land = W >= Hh * 1.05;
  const split = land ? (a > 1.5 ? .52 : .6) : .56; // wide strips get a wider tray
  const boardA = land ? { x: m, y: topRes, w: W * split - m * 1.5, h: Hh - topRes - m } : { x: m, y: topRes, w: W - 2 * m, h: Hh * split - topRes };
  const tray = land ? { x: W * split + m * .5, y: 24, w: W * (1 - split) - m * 1.5, h: Hh - 24 - m } : { x: m, y: Hh * split + 14, w: W - 2 * m, h: Hh * (1 - split) - 14 - m };
  // best.s is the largest piece height whose pieces fit the tray's grid of slots.
  let best = { s: 0, gc: 1, gr: n };
  for (let gc = 1; gc <= n; gc++) { const gr = Math.ceil(n / gc), s = Math.min(tray.w / gc / a, tray.h / gr); if (s > best.s) best = { s, gc, gr }; }
  const ph = Math.floor(Math.max(30, Math.min(boardA.w / (cols * a), boardA.h / rows, best.s * 1.12, 270, 900 / a)));
  const pw = Math.round(ph * a);
  const BW = pw * cols, BH = ph * rows, small = Math.min(pw, ph);
  const bx = Math.round(boardA.x + (boardA.w - BW) / 2), by = Math.round(boardA.y + (boardA.h - BH) / 2);
  const pad = cur.tabs ? Math.ceil(small * .3) : Math.ceil(small * .08) + 4, dpr = Math.min(window.devicePixelRatio || 1, 2);
  // Snap distance: generous, and longer along a piece's long side (strips).
  const snapX = small * .6 + (pw - small) * .15, snapY = small * .6 + (ph - small) * .15;
  L = { W, H: Hh, pw, ph, pad, bx, by, BW, BH, tray, best, dpr, snapX, snapY };

  // Scene: picture cropped to the board ("cover").
  const scene = document.createElement("canvas");
  scene.width = BW * dpr; scene.height = BH * dpr;
  const sc = scene.getContext("2d"); sc.scale(dpr, dpr);
  const iw = cur.img.naturalWidth || 480, ih = cur.img.naturalHeight || 360;
  const k = Math.max(BW / iw, BH / ih), dw = iw * k, dh = ih * k;
  sc.drawImage(cur.img, (BW - dw) / 2, (BH - dh) / 2, dw, dh);

  const sizeCanvas = (cv, w, h) => { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); cv.style.width = w + "px"; cv.style.height = h + "px"; const c = cv.getContext("2d"); c.setTransform(dpr, 0, 0, dpr, 0, 0); return c; };

  // Board: faint picture plus piece outlines as a guide.
  let g = sizeCanvas(ghost, BW, BH);
  ghost.style.transform = `translate(${bx}px, ${by}px)`;
  g.fillStyle = "#fffaf3"; g.fillRect(0, 0, BW, BH);
  g.globalAlpha = .32; g.drawImage(scene, 0, 0, BW, BH); g.globalAlpha = 1;
  g.strokeStyle = "rgba(255,255,255,.95)"; g.lineWidth = 3;
  pieces.forEach(p => g.stroke(piecePath(pw, ph, p.tabs, p.c * pw, p.r * ph)));
  g.strokeStyle = "rgba(92,52,96,.18)"; g.lineWidth = 1;
  pieces.forEach(p => g.stroke(piecePath(pw, ph, p.tabs, p.c * pw, p.r * ph)));

  // Finished picture shown on top at the end.
  const fc = sizeCanvas(full, BW, BH);
  full.style.transform = `translate(${bx}px, ${by}px)`;
  fc.drawImage(scene, 0, 0, BW, BH);

  slot.style.width = pw + "px"; slot.style.height = ph + "px";

  pieces.forEach(p => {
    const c = sizeCanvas(p.cv, pw + pad * 2, ph + pad * 2);
    const path = piecePath(pw, ph, p.tabs, pad, pad);
    c.save(); c.clip(path);
    c.drawImage(scene, pad - p.c * pw, pad - p.r * ph, BW, BH);
    c.lineWidth = 5; c.strokeStyle = "rgba(255,255,255,.55)"; c.stroke(path);
    c.restore();
    c.lineWidth = 1.5; c.strokeStyle = "rgba(70,35,80,.35)"; c.stroke(path);
    p.tx = bx + p.c * pw; p.ty = by + p.r * ph;
    if (p.locked) { p.x = p.tx; p.y = p.ty; } else { const s = slotPos(p); p.x = s.x; p.y = s.y; }
    p.el.style.zIndex = p.locked ? 2 : (p.z || (p.z = ++zTop));
    place(p);
  });

  fx.width = W * dpr; fx.height = Hh * dpr; fx.style.width = W + "px"; fx.style.height = Hh + "px";
}

function slotPos(p) {
  const { tray, best, pw, ph, W, H } = L;
  const sw = tray.w / best.gc, sh = tray.h / best.gr;
  const col = p.slot % best.gc, row = Math.floor(p.slot / best.gc);

}
const nearTarget = (p) => Math.abs(p.x - p.tx) < L.snapX && Math.abs(p.y - p.ty) < L.snapY;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

}
function showSlot(p, on) {

  else slot.classList.remove("show");

/* ---- Touch / mouse dragging (several fingers at once is fine) ---- */
const drags = new Map();
game.addEventListener("pointerdown", (e) => {
  lastTouch = Date.now();
  if (!cur || cur.done || !L || e.target.closest("button")) return;
  const { pad, pw, ph } = L, tol = Math.max(pad * .75, 12);
  let hit = null;
  for (const p of cur.pieces) {
    if (p.locked || p.dragging) continue;
    if (e.clientX >= p.x - tol && e.clientX <= p.x + pw + tol && e.clientY >= p.y - tol && e.clientY <= p.y + ph + tol) {
      if (!hit || p.z > hit.z) hit = p;
    }
  }
  if (!hit) return;
  e.preventDefault();
  try { game.setPointerCapture(e.pointerId); } catch (err) { }
  hit.dragging = true; hit.z = ++zTop; hit.el.style.zIndex = hit.z;
  hit.el.classList.remove("anim", "wiggle"); hit.el.classList.add("lifted");
  drags.set(e.pointerId, { p: hit, ox: e.clientX - hit.x, oy: e.clientY - hit.y });
  audio(); sfx.pick();
});

  const d = drags.get(e.pointerId); if (!d) return;
  e.preventDefault();
  const p = d.p, { pw, ph, W, H } = L;
  p.x = clamp(e.clientX - d.ox, -pw * .4, W - pw * .6);
  p.y = clamp(e.clientY - d.oy, -ph * .4, H - ph * .6);

  drags.delete(e.pointerId);
  const p = d.p, { pw, ph, bx, by, BW, BH } = L;
  p.dragging = false; p.el.classList.remove("lifted");
  showSlot(p, false);
  if (nearTarget(p)) return lock(p);
  const cx = p.x + pw / 2, cy = p.y + ph / 2;
  if (cx > bx && cx < bx + BW && cy > by && cy < by + BH) { const s = slotPos(p); animateTo(p, s.x, s.y); }
};
game.addEventListener("pointerup", endDrag);
game.addEventListener("pointercancel", endDrag);

function lock(p) {
  p.locked = true; p.el.classList.add("locked"); p.el.style.zIndex = 2;
  sfx.snap(cur.locked);
  cur.locked++;
  animateTo(p, p.tx, p.ty, () => burst(p.tx + L.pw / 2, p.ty + L.ph / 2, 14, 1));
  if (cur.locked === cur.pieces.length) win();
}

function win() {
  cur.done = true;
  const token = cur;
  stars[cur.art.id] = true; store.set("stars", stars);
  setTimeout(() => {
    if (cur !== token) return;
    full.classList.add("show");
    ghost.classList.add("cheer"); full.classList.add("cheer");
    sfx.win();
    speak(cur.art.name ? `Yay! You did it! ${cur.art.name}!` : "Yay! You did it!");
    for (let k = 0; k < 4; k++) setTimeout(() => burst(L.W * (.2 + .2 * k), L.H * .35, 40, 2.2), k * 180);
  }, 380);
  setTimeout(() => { if (cur === token) doneBar.hidden = false; }, 1500);
}

/* ---- Help: after a quiet spell, wiggle a piece and light up its spot ---- */
setInterval(() => {
  if (!cur || cur.done || game.hidden || drags.size || Date.now() - lastTouch < 12000) return;
  lastTouch = Date.now();
  const left = cur.pieces.filter(p => !p.locked);
  if (!left.length) return;
  const p = left[Math.floor(Math.random() * left.length)];
  p.el.classList.remove("wiggle"); void p.el.offsetWidth; p.el.classList.add("wiggle");
  showSlot(p, true);
  setTimeout(() => { p.el.classList.remove("wiggle"); if (!drags.size) showSlot(p, false); }, 1700);

/* ---- Sparkles and confetti ---- */
const parts = []; let fxRunning = false;
let fxCanvas = fx; // the puzzle screen and the mini games each have their own effects canvas
const FX_COLORS = ["#ff5d8f", "#ffc93c", "#6fc2ff", "#4cc79c", "#b98cff", "#ff9f43"];
function burst(x, y, n, power) {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = (2 + Math.random() * 4) * power;
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - power * 2, life: 1, rot: Math.random() * 6, vr: (Math.random() - .5) * .4, s: 5 + Math.random() * 6, c: FX_COLORS[i % FX_COLORS.length], star: i % 3 === 0 });
  }

}
function tick() {
  const cv = fxCanvas, c = cv.getContext("2d"), dpr = cv.width / (cv.clientWidth || cv.width || 1), H = cv.clientHeight || 2000;
  c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, cv.width, cv.height);
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.x += p.vx; p.y += p.vy; p.vy += .22; p.vx *= .99; p.rot += p.vr; p.life -= .012;
    if (p.life <= 0 || p.y > H + 40) { parts.splice(i, 1); continue; }
    c.save(); c.globalAlpha = Math.min(1, p.life * 2); c.translate(p.x, p.y); c.rotate(p.rot); c.fillStyle = p.c;
    if (p.star) c.fill(new Path2D(starD(0, 0, p.s, p.s * .45))); else c.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
    c.restore();
  }
  if (parts.length) requestAnimationFrame(tick); else { fxRunning = false; c.clearRect(0, 0, cv.width, cv.height); }
}

    const s = Math.floor(Math.max(36, Math.min(r.width / per - 10, r.height / rows - 10, 150)));
    items.style.setProperty("--s", s + "px");
    tone(NOTES[n - 1], 0, .25, "triangle", .22);
    sayQueued(WORDS[n] + "!");
    // Count them in, one at a time, after the number has been said.
    for (let k = 1; k <= n; k++) this.timers.push(setTimeout(() => {
      items.insertAdjacentHTML("beforeend", svgWrap(vb, draw()));
      tone(NOTES[k - 1], 0, .15, "sine", .14);
      if (n > 1) sayQueued(WORDS[k]);
    }, 900 + (k - 1) * 750));
    this.timers.push(setTimeout(() => {
      sayQueued(`${WORDS[n]} ${n === 1 ? one : many}!`);
      const ir = items.getBoundingClientRect();
      burst(ir.left + ir.width / 2, ir.top + ir.height / 2, 18 + n * 2, 1.4);
    }, 900 + n * 750));
  },
  stop() { this.timers.forEach(clearTimeout); this.timers = []; },
  thumb: thumbURL(`<defs><linearGradient id="nt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3b0"/><stop offset="1" stop-color="#ffd36b"/></linearGradient></defs><rect width="480" height="360" fill="url(#nt)"/>` +
    [[40, "#ff4d5e", "1"], [180, "#44c76b", "2"], [320, "#3fa2f7", "3"]].map(([x, c, d], i) => `<rect x="${x}" y="${i % 2 ? 150 : 110}" width="120" height="130" rx="28" fill="${c}"/><rect x="${x}" y="${(i % 2 ? 150 : 110) + 112}" width="120" height="18" rx="9" fill="rgba(0,0,0,.15)"/><text x="${x + 60}" y="${(i % 2 ? 150 : 110) + 100}" text-anchor="middle" font-family="Arial Rounded MT Bold, Arial, sans-serif" font-weight="900" font-size="100" fill="#fff">${d}</text>`).join("") +
    `<path d="${starD(80, 60, 22, 10)}" fill="#ff9f2e"/><path d="${starD(420, 64, 18, 8)}" fill="#ff7ac2"/><path d="${starD(250, 330, 16, 7)}" fill="#9b6cf0"/>`),
};

/* ---- Balloon pop: balloons float up; popping one says its color or number ---- */
const balloonGame = {
  name: "Balloon pop",
  start(el) {
    el.className = "balloons";
    this.mode = store.get("balloonMode", "colors"); this.list = []; this.pops = 0; this.last = 0; this.spawnAt = 0;
    el.innerHTML = `<div class="sky-bg">${svgWrap("0 0 480 360", softCloud(80, 70, .9) + softCloud(390, 50, .8) + softCloud(250, 140, .6) + `<path d="M0 330 Q120 310 240 326 T480 320 V360 H0Z" fill="#a7e07a"/>`).replace("<svg", '<svg preserveAspectRatio="xMidYMid slice"')}</div>
      <div id="balloonLayer"></div>
      <div class="corner-tools"><button class="tool-btn" data-mode="colors" aria-label="Say colors">${svgWrap("0 0 48 48", '<circle cx="15" cy="17" r="9" fill="#ff4d5e"/><circle cx="33" cy="17" r="9" fill="#3fa2f7"/><circle cx="24" cy="33" r="9" fill="#ffd23f"/>')}</button><button class="tool-btn" data-mode="numbers" aria-label="Say numbers">123</button></div>`;
    this.layer = el.querySelector("#balloonLayer");
    const tools = el.querySelector(".corner-tools");
    const mark = () => tools.querySelectorAll(".tool-btn").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === this.mode));
    mark();
    tools.addEventListener("click", (e) => { const b = e.target.closest(".tool-btn"); if (!b) return; this.mode = b.dataset.mode; store.set("balloonMode", this.mode); mark(); sfx.pick(); });
    this.layer.addEventListener("pointerdown", (e) => { const b = e.target.closest(".balloon"); if (!b) return; e.preventDefault(); audio(); this.pop(b); });
    this.frame = requestAnimationFrame((t) => this.tick(t));
  },
  spawn() {
    const W = play.clientWidth, H = play.clientHeight, size = Math.round(Math.max(90, Math.min(W, H) * .17));
    const [name, color] = BALLOON_COLORS[Math.floor(Math.random() * BALLOON_COLORS.length)], n = 1 + Math.floor(Math.random() * 10);
    const el = document.createElement("div");
    el.className = "balloon"; el.style.width = size + "px";
    el.innerHTML = svgWrap("-40 -48 80 170", balloonShape(color, this.mode === "numbers" ? String(n) : ""));
    this.layer.appendChild(el);
    const b = { el, name, color, n, size, x: size * .2 + Math.random() * (W - size * 1.4), y: H + 20, v: (H / 9) * (.75 + Math.random() * .5), phase: Math.random() * 6 };
    el._b = b; this.list.push(b);
  },
  tick(t) {
    const dt = Math.min(.05, (t - (this.last || t)) / 1000); this.last = t;
    if (t > this.spawnAt && this.list.length < 7) { this.spawn(); this.spawnAt = t + 900 + Math.random() * 700; }
    for (const b of [...this.list]) {
      b.y -= b.v * dt; b.phase += dt * 1.6;
      b.el.style.transform = `translate3d(${b.x + Math.sin(b.phase) * 14}px, ${b.y}px, 0)`;
      if (b.y < -b.size * 2.4) { b.el.remove(); this.list.splice(this.list.indexOf(b), 1); }
    }
    this.frame = requestAnimationFrame((tt) => this.tick(tt));
  },
  pop(el) {
    const b = el._b; if (!b || b.popped) return;
    b.popped = true; this.list.splice(this.list.indexOf(b), 1);
    const r = el.getBoundingClientRect(); el.remove();
    popSound(); burst(r.left + r.width / 2, r.top + r.width * .55, 22, 1.3);
    stopSpeech(); sayQueued(this.mode === "numbers" ? WORDS[b.n] + "!" : b.name + "!");
    if (++this.pops % 10 === 0) setTimeout(() => { sfx.win(); for (let k = 0; k < 3; k++) setTimeout(() => burst(play.clientWidth * (.25 + .25 * k), play.clientHeight * .4, 40, 2.2), k * 160); }, 500);
  },
  stop() { cancelAnimationFrame(this.frame); this.list = []; },
  thumb: thumbURL(`<defs><linearGradient id="bt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fd3ff"/><stop offset="1" stop-color="#e9f8ff"/></linearGradient></defs><rect width="480" height="360" fill="url(#bt)"/>` +
    softCloud(90, 60, .8) + softCloud(400, 300, .9) + [[110, 190, "#ff4d5e", 1], [210, 130, "#ffd23f", 1.1], [320, 180, "#3fa2f7", 1], [400, 100, "#9b6cf0", .8], [60, 90, "#44c76b", .7]].map(([x, y, c, s]) => at(x, y, s * 1.3, balloonShape(c))).join("")),
};

/* ---- Rainbow xylophone: tap or swipe the bars; the note button plays a song ---- */
const SCALE = [523.25, 587.33, 659.25, 698.46, 783.99, 880, 987.77, 1046.5];
const TWINKLE = [[0, 1], [0, 1], [4, 1], [4, 1], [5, 1], [5, 1], [4, 2], [3, 1], [3, 1], [2, 1], [2, 1], [1, 1], [1, 1], [0, 2]];
const xyloGame = {
  name: "Rainbow xylophone",
  start(el) {
    el.className = "xylophone"; this.timers = []; this.fingers = new Map();
    el.innerHTML = `<div class="xylo-bg"></div><div class="xylo">${BAR_COLORS.map((c, i) => `<div class="bar" data-i="${i}" style="--c:${c};height:${92 - i * 6}%"></div>`).join("")}</div>
      <div class="corner-tools"><button class="tool-btn" id="songBtn" aria-label="Play a song">${NOTE_SVG("#3b2a4a")}</button></div>`;
    const xylo = el.querySelector(".xylo");
    const barAt = (x, y) => { const t = document.elementFromPoint(x, y); return t && t.closest ? t.closest(".bar") : null; };
    xylo.addEventListener("pointerdown", (e) => {
      const bar = e.target.closest(".bar"); if (!bar) return;
      e.preventDefault(); audio(); try { xylo.setPointerCapture(e.pointerId); } catch (err) { }
      this.fingers.set(e.pointerId, bar); this.hit(+bar.dataset.i);
    });
    // Sliding a finger across the bars plays each one, like a glissando.
    xylo.addEventListener("pointermove", (e) => {
      if (!this.fingers.has(e.pointerId)) return;
      const bar = barAt(e.clientX, e.clientY);
      if (bar && bar !== this.fingers.get(e.pointerId)) { this.fingers.set(e.pointerId, bar); this.hit(+bar.dataset.i); }
    });
    const up = (e) => this.fingers.delete(e.pointerId);
    xylo.addEventListener("pointerup", up); xylo.addEventListener("pointercancel", up);
    el.querySelector("#songBtn").addEventListener("click", () => { audio(); this.timers.length ? this.stopSong() : this.song(); });
  },
  hit(i) {
    const f = SCALE[i];
    tone(f, 0, 1.4, "sine", .32); tone(f * 2.01, 0, .5, "triangle", .05); tone(f * 4, 0, .1, "sine", .05);
    const bar = playArea.querySelector(`.bar[data-i="${i}"]`); if (!bar) return;
    bar.classList.remove("hit"); void bar.offsetWidth; bar.classList.add("hit");
    setTimeout(() => bar.classList.remove("hit"), 160);
    const r = bar.getBoundingClientRect(), n = document.createElement("div");
    n.className = "note-fly"; n.innerHTML = NOTE_SVG(BAR_COLORS[i]);
    n.style.left = (r.left + r.width / 2) + "px"; n.style.top = (r.top - 10) + "px";
    playArea.appendChild(n); setTimeout(() => n.remove(), 1350);
  },
  song() {
    $("#songBtn").setAttribute("aria-pressed", "true");
    let t = 0;
    TWINKLE.forEach(([i, beats]) => { this.timers.push(setTimeout(() => this.hit(i), t)); t += beats * 480; });
    this.timers.push(setTimeout(() => this.stopSong(), t));
  },
  stopSong() { this.timers.forEach(clearTimeout); this.timers = []; const b = $("#songBtn"); if (b) b.setAttribute("aria-pressed", "false"); },
  stop() { this.stopSong(); },
  thumb: thumbURL(`<defs><radialGradient id="xt" cx=".5" cy=".3" r=".8"><stop offset="0" stop-color="#fff8ee"/><stop offset="1" stop-color="#ffe0bd"/></radialGradient></defs><rect width="480" height="360" fill="url(#xt)"/>` +
    `<rect x="30" y="112" width="420" height="16" rx="8" fill="#b9814f" transform="rotate(-4 240 120)"/><rect x="30" y="236" width="420" height="16" rx="8" fill="#b9814f" transform="rotate(4 240 244)"/>` +
    BAR_COLORS.map((c, i) => { const h = 250 - i * 16, x = 48 + i * 50; return `<rect x="${x}" y="${180 - h / 2}" width="40" height="${h}" rx="14" fill="${c}"/><circle cx="${x + 20}" cy="${180 - h / 2 + 22}" r="5" fill="#fff"/><circle cx="${x + 20}" cy="${180 + h / 2 - 22}" r="5" fill="#fff"/>`; }).join("") +
    `<g transform="rotate(-30 400 70)"><rect x="396" y="40" width="8" height="90" rx="4" fill="#d9a46a"/><circle cx="400" cy="38" r="16" fill="#ff5d8f"/></g>` +
    [[90, 50, "#ff4d5e"], [250, 40, "#3fa2f7"]].map(([x, y, c]) => `<g transform="translate(${x} ${y}) scale(1.2)"><path d="M18 36 V10 L38 6 V30" stroke="${c}" stroke-width="5" fill="none"/><ellipse cx="13" cy="37" rx="7" ry="5.5" fill="${c}"/><ellipse cx="33" cy="31" rx="7" ry="5.5" fill="${c}"/></g>`).join("")),
};
const GAMES = { numbers: numbersGame, balloons: balloonGame, xylophone: xyloGame };

// Automated tests open the page with #selftest to read piece targets.
if (location.hash === "#selftest") window.__pp = { get cur() { return cur; }, get L() { return L; } };
renderModes(); renderSizes(); renderSound(); renderShelves();
loadPhotos().then(() => { if (photoArt.length) renderShelves(); });
})();
</script>
